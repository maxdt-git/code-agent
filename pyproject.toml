[project]
name = "agent_smith"
version = "0.1.0"
description = ""
requires-python = "==3.10.*"

dependencies = [
    "pydantic>=2.0",
    "mcp>=1.22.0,<2",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[project.scripts]
sandbox = "agent_smith.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_smith",
    "src/agent_mbpp",
    "src/agent_swebench",
]
